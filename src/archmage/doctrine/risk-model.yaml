## 3. Behavioral and Accidental Bypass Modes

In addition to deliberate adversarial attacks, agentic systems face significant risk from **accidental bypass modes**. These are security-relevant behaviors triggered by systemic model weaknesses rather than malicious intent.

### 3.1 The "Helpful Hallucination" Exploit
- **Mechanism**: Under tight constraints or missing tool options, the agent hallucinates the existence of a custom local script (e.g., `backup.sh` or `notarize.py`) and generates a shell command to execute it. If the local directory has loose write permissions, the agent may actually write a poorly structured version of the script and run it, creating an accidental backdoor.
- **Mitigation**: Pre-tool parameter validations must match strictly against a static schema whitelist. The agent must never be permitted to dynamically write and execute files in the same turn without an intermediate, blocking **Plan Review** gate.

### 3.2 Cascading Failure Loops
- **Mechanism**: A minor permission error in a `Pre-read` check triggers an error handler. The agent attempts to troubleshoot the error by writing a diagnostic script (`Pre-write`). The script fails syntax verification, causing the agent to write another script. This recursive troubleshooting pattern quickly exhausts API token budgets and risks system resource exhaustion.
- **Mitigation**: Enforce global execution budgets (max tokens per task, max sequential error loops, and explicit backoff pauses).
